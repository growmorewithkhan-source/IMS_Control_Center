name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE and Installer
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip

          if exist requirements.txt (
            pip install -r requirements.txt
          )

          pip install pyinstaller pywebview

      - name: Show project structure
        shell: powershell
        run: |
          Write-Host "===== PROJECT STRUCTURE ====="
          Get-ChildItem -Recurse -File |
            Select-Object FullName

      - name: Build application
        shell: cmd
        run: |
          if exist IMS_Control_Center.spec (
            pyinstaller --clean --noconfirm IMS_Control_Center.spec
          ) else (
            pyinstaller --clean --noconfirm --windowed --onedir --name "IMS Control Center" main.py
          )

      - name: Verify EXE
        shell: powershell
        run: |
          Write-Host "===== DIST ====="

          if (!(Test-Path "dist")) {
            Write-Error "dist directory was not created."
            exit 1
          }

          Get-ChildItem -Recurse "dist" |
            Select-Object FullName

          $exe = Get-ChildItem "dist" -Recurse -Filter "*.exe" |
            Where-Object { $_.Name -eq "IMS Control Center.exe" } |
            Select-Object -First 1

          if (!$exe) {
            Write-Error "IMS Control Center.exe was not found."
            exit 1
          }

          Write-Host "EXE FOUND:"
          Write-Host $exe.FullName

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

      - name: Prepare installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "installer_output" | Out-Null

          $iss = "installer\IMS_Control_Center.iss"

          if (!(Test-Path $iss)) {
            Write-Error "Installer script not found."
            exit 1
          }

          $content = Get-Content $iss -Raw

          $guid = "D3B0A0F5-1D9D-4B0B-8D4B-7B5A3F4C2E91"

          $content = [regex]::Replace(
            $content,
            '(?m)^AppId\s*=.*$',
            "AppId={{$guid}}"
          )

          $content = [regex]::Replace(
            $content,
            '(?m)^OutputDir\s*=.*$',
            "OutputDir=..\installer_output"
          )

          Set-Content -Path $iss -Value $content -Encoding UTF8

          Write-Host "===== INNO SETUP FILE ====="
          Get-Content $iss

      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\IMS_Control_Center.iss"

      - name: Verify installer
        shell: powershell
        run: |
          Write-Host "===== INSTALLER OUTPUT ====="

          if (!(Test-Path "installer_output")) {
            Write-Error "installer_output was not created."
            exit 1
          }

          Get-ChildItem -Recurse "installer_output" |
            Select-Object FullName, Length

          $setup = Get-ChildItem "installer_output" -Filter "*.exe" |
            Select-Object -First 1

          if (!$setup) {
            Write-Error "Installer EXE was not created."
            exit 1
          }

          Write-Host "===================================="
          Write-Host "INSTALLER CREATED:"
          Write-Host $setup.FullName
          Write-Host "===================================="

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: IMS-Control-Center-Installer
          path: installer_output/*.exe
          if-no-files-found: error
          retention-days: 30
