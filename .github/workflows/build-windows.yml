name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          if exist requirements.txt (
            pip install -r requirements.txt
          )
          pip install pyinstaller pywebview

      - name: Build application
        shell: cmd
        run: |
          if exist IMS_Control_Center.spec (
            pyinstaller --clean --noconfirm IMS_Control_Center.spec
          ) else (
            pyinstaller --clean --noconfirm --windowed --name "IMS Control Center" main.py
          )

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: |
          if exist installer\IMS_Control_Center.iss (
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\IMS_Control_Center.iss
          ) else (
            echo Inno Setup script not found
            exit /b 1
          )

      - name: Find installer
        shell: powershell
        run: |
          Get-ChildItem -Path . -Recurse -Filter "*.exe" |
            Where-Object { $_.FullName -notmatch "\\dist\\" } |
            Select-Object FullName

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: IMS-Control-Center-Installer
          path: |
            installer_output/*.exe
            output/*.exe
            setup/*.exe
          if-no-files-found: error
